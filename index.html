<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feuille de Personnage - Chroniques Oubliées Fantasy 2</title>
    <link rel="stylesheet" href="style.css">
    <!-- Bibliothèques pour l'exportation PDF / Image si besoin -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

    <header class="app-header no-print">
        <h1>Feuille de Personnage - COF2</h1>
        <div class="actions">
            <button id="btn-save" class="btn">Sauvegarder</button>
            <button id="btn-export" class="btn">Exporter en Image</button>
            <button id="btn-reset" class="btn btn-danger">Réinitialiser</button>
        </div>
    </header>

    <main class="sheet-container">
        <!-- PAGE 1 : IDENTITÉ, CARACTÉRISTIQUES, VOIES ET COMBAT -->
        <div class="grimoire-spread page-1">
            <div class="grimoire-page">
                <!-- En-tête / Identité -->
                <section class="section-box header-box">
                    <h2>Identité du Personnage</h2>
                    <div class="grid-2">
                        <div class="field">
                            <label for="nom">Nom du Personnage</label>
                            <input type="text" id="nom" placeholder="Ex: Thorgal">
                        </div>
                        <div class="field">
                            <label for="joueur">Nom du Joueur</label>
                            <input type="text" id="joueur" placeholder="Ex: Xavier">
                        </div>
                        <div class="field">
                            <label for="profil">Profil</label>
                            <select id="profil">
                                <option value="">-- Sélectionnez un Profil --</option>
                                <option value="Guerrier">Guerrier</option>
                                <option value="Voleur">Voleur</option>
                                <option value="Mage">Mage</option>
                                <option value="Pretre">Prêtre</option>
                                <option value="Barde">Barde</option>
                                <option value="Rôdeur">Rôdeur</option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="voie_prestige">Voie de Prestige / Spécialisation</label>
                            <input type="text" id="voie_prestige" placeholder="Ex: Assassin">
                        </div>
                        <div class="field">
                            <label for="peuple">Peuple</label>
                            <select id="peuple">
                                <option value="">-- Sélectionnez un Peuple --</option>
                                <option value="Humain">Humain</option>
                                <option value="Elfe">Elfe</option>
                                <option value="Nain">Nain</option>
                                <option value="Halfelin">Halfelin</option>
                                <option value="Demi-Orque">Demi-Orque</option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="niveau">Niveau</label>
                            <input type="number" id="niveau" value="1" min="1" max="20">
                        </div>
                    </div>
                    <!-- Choix dynamiques de peuple -->
                    <div id="peuple-options-container" class="hidden dynamic-section">
                        <h3>Options de Peuple</h3>
                        <div class="grid-2">
                            <div class="field" id="opt_bonus1_wrapper">
                                <label for="opt_bonus1" id="label_bonus1">Bonus Caractéristique</label>
                                <select id="opt_bonus1">
                                    <option value="FOR">Force</option>
                                    <option value="DEX">Dextérité</option>
                                    <option value="CON">Constitution</option>
                                    <option value="INT">Intelligence</option>
                                    <option value="SAG">Sagesse</option>
                                    <option value="CHA">Charisme</option>
                                </select>
                            </div>
                            <div class="field" id="opt_malus1_wrapper">
                                <label for="opt_malus1" id="label_malus1">Malus Caractéristique</label>
                                <select id="opt_malus1">
                                    <option value="FOR">Force</option>
                                    <option value="DEX">Dextérité</option>
                                    <option value="CON">Constitution</option>
                                    <option value="INT">Intelligence</option>
                                    <option value="SAG">Sagesse</option>
                                    <option value="CHA">Charisme</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Caractéristiques -->
                <section class="section-box stats-box">
                    <h2>Caractéristiques</h2>
                    <div class="stats-grid">
                        <div class="stat-card">
                            <label for="carac_FOR">FORCE</label>
                            <input type="number" id="carac_FOR" value="10" class="stat-score">
                            <span class="mod-display" id="mod_FOR">+0</span>
                        </div>
                        <div class="stat-card">
                            <label for="carac_DEX">DEXTÉRITÉ</label>
                            <input type="number" id="carac_DEX" value="10" class="stat-score">
                            <span class="mod-display" id="mod_DEX">+0</span>
                        </div>
                        <div class="stat-card">
                            <label for="carac_CON">CONSTITUTION</label>
                            <input type="number" id="carac_CON" value="10" class="stat-score">
                            <span class="mod-display" id="mod_CON">+0</span>
                        </div>
                        <div class="stat-card">
                            <label for="carac_INT">INTELLIGENCE</label>
                            <input type="number" id="carac_INT" value="10" class="stat-score">
                            <span class="mod-display" id="mod_INT">+0</span>
                        </div>
                        <div class="stat-card">
                            <label for="carac_SAG">SAGESSE</label>
                            <input type="number" id="carac_SAG" value="10" class="stat-score">
                            <span class="mod-display" id="mod_SAG">+0</span>
                        </div>
                        <div class="stat-card">
                            <label for="carac_CHA">CHARISME</label>
                            <input type="number" id="carac_CHA" value="10" class="stat-score">
                            <span class="mod-display" id="mod_CHA">+0</span>
                        </div>
                    </div>
                </section>

                <!-- Voies et Capacités -->
                <section class="section-box voies-box">
                    <h2>Voies et Capacités</h2>
                    <div id="voies-container">
                        <!-- Généré via JS ou listes de champs -->
                        <div class="voie-row">
                            <input type="text" placeholder="Nom de la Voie" class="voie-nom">
                            <div class="rangs-checkboxes">
                                <label><input type="checkbox" name="v1_r1"> R1</label>
                                <label><input type="checkbox" name="v1_r2"> R2</label>
                                <label><input type="checkbox" name="v1_r3"> R3</label>
                                <label><input type="checkbox" name="v1_r4"> R4</label>
                                <label><input type="checkbox" name="v1_r5"> R5</label>
                            </div>
                        </div>
                        <div class="voie-row">
                            <input type="text" placeholder="Nom de la Voie" class="voie-nom">
                            <div class="rangs-checkboxes">
                                <label><input type="checkbox" name="v2_r1"> R1</label>
                                <label><input type="checkbox" name="v2_r2"> R2</label>
                                <label><input type="checkbox" name="v2_r3"> R3</label>
                                <label><input type="checkbox" name="v2_r4"> R4</label>
                                <label><input type="checkbox" name="v2_r5"> R5</label>
                            </div>
                        </div>
                        <div class="voie-row">
                            <input type="text" placeholder="Nom de la Voie" class="voie-nom">
                            <div class="rangs-checkboxes">
                                <label><input type="checkbox" name="v3_r1"> R1</label>
                                <label><input type="checkbox" name="v3_r2"> R2</label>
                                <label><input type="checkbox" name="v3_r3"> R3</label>
                                <label><input type="checkbox" name="v3_r4"> R4</label>
                                <label><input type="checkbox" name="v3_r5"> R5</label>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </div>

        <!-- PAGE 2 : ÉQUIPEMENT, MAGIE, COMPÉTENCES & INFORMATIONS -->
        <div class="grimoire-spread page-2">
            <div class="grimoire-page">
                <!-- Combat & Défense -->
                <section class="section-box combat-box">
                    <h2>État & Combat</h2>
                    <div class="grid-3">
                        <div class="field">
                            <label for="pv_max">PV Max</label>
                            <input type="number" id="pv_max" value="10">
                        </div>
                        <div class="field">
                            <label for="pv_actuels">PV Actuels</label>
                            <input type="number" id="pv_actuels" value="10">
                        </div>
                        <div class="field">
                            <label for="defense">Défense (CAC)</label>
                            <input type="number" id="defense" value="10">
                        </div>
                    </div>
                </section>

                <!-- Équipement -->
                <section class="section-box equipement-box">
                    <h2>Équipement & Trésors</h2>
                    <textarea id="equipement" placeholder="Armes, armures, objets magiques, bourses..."></textarea>
                </section>

                <!-- BLOC COMPÉTENCES (Règles optionnelles) -->
                <section class="section-box competences-box">
                    <h2>Compétences (Règles Optionnelles)</h2>
                    <textarea id="competences" placeholder="Listez ici vos maîtrises de compétences, artisanats, connaissances particulières..."></textarea>
                </section>

                <!-- BLOC LANGUES ET INFORMATIONS ADDITIONNELLES -->
                <section class="section-box info-box">
                    <h2>Langues et Informations Additionnelles</h2>
                    <div class="grid-2">
                        <div class="field">
                            <label for="langues">Langues connues</label>
                            <textarea id="langues" placeholder="Commun, Nain, Elfique..."></textarea>
                        </div>
                        <div class="field">
                            <label for="notes_diverses">Informations additionnelles / Historique</label>
                            <textarea id="notes_diverses" placeholder="Signes particuliers, divinité, background..."></textarea>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
